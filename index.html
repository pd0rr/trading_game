<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
    <script src="./market.js"></script>
    <script src="./session.js"></script>
    <script src="./strings.js"></script>
    <script src="./script.js" defer></script>
    <script src="./levels.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Price Action</title>
</head>
<body>
    <p>
        <label for="price">Price: </label> <span id="price">0</span>
        <button id="Update">Update</button>
        <button id="play">Play</button>
        <button id="stop">Pause</button>
        <span id="message"></span>
    </p>

        <label for="money">Balance: </label> <span id="money">10000</span>
    </p>
    <p>
        <label for="shares">Position: </label> <span id="shares">0</span>
        
    </p>
    <p>
        <label for="amount" >Amount: </label><input type="number" id="amount" value="100">
        <button id="Buy">Buy</button>
        <button id="Sell">Sell</button>
    </p>

    <!-- chart -->
    <div id="chart"></div>

    <div id="tutorial">
        <select id="level-select">
            <option value="s">Select level</option>
            <option value="0">Level 0: buying and selling</option>
            <option value="1">Level 1: trends</option>
            <option value="2">Level 2: support and resistance</option>
            <option value="3">Level 3: buy and hold</option>
            <option value="4">Level 4: position trading</option>
        </select>
        <div id="tutorial-text">
            <p>
                Welcome to <strong>Price Action</strong>! A game about trading the financial markets. 
            </p>
            <p>
                Use the drop-down menu above to select a <strong>tutorial</strong> level.
            </p>
        </div>
        
        
    </div>
</body>
</html>
